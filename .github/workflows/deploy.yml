name: Deploy to GitHub Pages (Automated Auto-Sync)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  # Automated continuous deployment: rebuilds automatically every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Automated webhook trigger from Zapier / Make / external events
  repository_dispatch:
    types: [linkedin-sync, webhook-sync, auto-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
